<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LAN Media simulator</title>
    <style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
    <canvas id="display" width="1920" height="1080"></canvas>
    <video id="player" style="display: none" crossorigin="anonymous"></video>
    <script src="lib/brs.api.js"></script>
    <script>
        async function boot() {
            await brs.initialize(
                { displayMode: "1080p", extensions: new Map([[brs.SupportedExtension.SceneGraph, "./brs-sg.js"]]) },
                { debugToConsole: true, disableKeys: true }
            );
            // Give the engine time to finish loading common.zip before starting the app.
            await new Promise((resolve) => setTimeout(resolve, 3000));
            const app = await (await fetch("app.zip")).arrayBuffer();
            brs.execute("roku-lan-media.zip", app, { clearDisplayOnExit: false, muteSound: true });
        }
        window.addEventListener("load", boot);
    </script>
</body>
</html>
